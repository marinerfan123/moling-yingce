apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-generation }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker-generation } }
  template:
    metadata: { labels: { app: worker-generation } }
    spec:
      serviceAccountName: worker-generation
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker-generation
          image: registry.example/comic/worker-generation@sha256:REPLACED_BY_RENDERER
          env: [{ name: APP_PROCESS_ROLE, value: worker-generation }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          livenessProbe: { exec: { command: ["node", "packages/config/dist/loopback-health-probe.js", "3104"] } }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
