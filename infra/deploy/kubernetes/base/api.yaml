apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      serviceAccountName: api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example/comic/api@sha256:REPLACED_BY_RENDERER
          envFrom: [{ configMapRef: { name: comic-canvas-runtime } }]
          env: [{ name: APP_PROCESS_ROLE, value: api }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          ports: [{ containerPort: 3001 }]
          readinessProbe: { httpGet: { path: /health, port: 3001 } }
          livenessProbe: { httpGet: { path: /health, port: 3001 } }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec: { selector: { app: api }, ports: [{ port: 3001, targetPort: 3001 }] }
