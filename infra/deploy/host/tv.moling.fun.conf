map $http_upgrade $comic_canvas_connection_upgrade {
    default upgrade;
    '' close;
}

upstream comic_canvas_tv_web {
    server 127.0.0.1:3300;
}

server {
    listen 80;
    listen [::]:80;
    server_name tv.moling.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tv-moling-fun-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://tv.moling.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tv.moling.fun;

    ssl_certificate /etc/letsencrypt/live/tv.moling.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.moling.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ComicCanvasTVSSL:10m;

    client_max_body_size 1024m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tv-moling-fun-acme;
        try_files $uri =404;
    }

    # Keep long-lived model and agent event streams unbuffered at the outer proxy.
    location ~ ^/api/(tasks/[^/]+/text-events|agent/runs/[^/]+/events|ai/system/[^/]+/(responses|chat/completions|models/[^/]+:streamGenerateContent))$ {
        proxy_pass http://comic_canvas_tv_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://comic_canvas_tv_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $comic_canvas_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
